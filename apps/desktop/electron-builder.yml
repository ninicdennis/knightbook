appId: dev.knightbook.app
productName: Knightbook
directories:
  output: release
  buildResources: build

# build/icon.png is the 1024px master derived from docs/assets/knightbook-logo.png.
# electron-builder derives the .ico and .icns from it, so there is one source
# image rather than three that can drift apart.

files:
  - dist/**
  - package.json

# Technical design section 2: the Node runtime and the bundled MCP server ship
# outside the ASAR archive so the AI client can execute them directly. The
# installed path is what the user saves in their client configuration, so it has
# to stay stable across updates.
#
# Staged per architecture, and ${arch} is expanded for each one packaged: the mac
# target builds arm64 and x64 in one run, and each needs a Node for its own CPU.
# Installed, it is still `mcp`, so the saved client command does not change.
extraResources:
  - from: resources/mcp-${arch}
    to: mcp
    filter:
      - '**/*'

  # The workflow skill, straight from the one copy in the repository, so the
  # installed app can install or export it with no source checkout.
  - from: ../../skills/projectspace
    to: skills/projectspace
    filter:
      - '**/*'

asar: true

# Installer names carry the version, OS and CPU and no spaces, so they work as
# download URLs and the release workflow can check it has one of each
# (scripts/publishing/release-assets.mjs). Windows is x64 only (D-028), so its CPU
# is written out rather than left to ${arch}.
win:
  artifactName: Knightbook-${version}-windows-x64.${ext}
  target:
    - target: nsis
      arch: [x64]

mac:
  artifactName: Knightbook-${version}-macos-${arch}.${ext}
  target:
    - target: dmg
      arch: [arm64, x64]
  category: public.app-category.developer-tools

# The deb refuses to build without a homepage (package.json `homepage`) and a
# maintainer with an email. Both are shown by `apt show`. The homepage is the
# repository until the website's domain is chosen (ticket 577513c8); the email is
# GitHub's no-reply address, so no personal inbox is published.
linux:
  artifactName: Knightbook-${version}-linux-${arch}.${ext}
  maintainer: Knightbook <40923967+ninicdennis@users.noreply.github.com>
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  category: Development
