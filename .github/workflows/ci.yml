name: CI

# Validates pull requests, and every merge to main through the release workflow
# (release.yml), which calls this one. It has no secrets, no publishing and
# read-only repository access; publishing stays in release.yml's own job.
#
# Two jobs: `check` (lint, format, typecheck, every test suite) and `package`
# (build the real app, then test it). `package` waits for `check`, so a broken
# lint or test costs no packaging minutes. Given a version, `package` builds the
# installers instead of a bare folder, stamped with that version, and keeps them
# as artifacts for release.yml to publish.
#
# Platforms follow the trigger, to stay inside the Actions allowance:
# - pull requests run on Linux only;
# - merges to main (through release.yml) run on Windows, Linux and macOS;
# - a manual run ("Run workflow" on the Actions tab) runs all three on any branch,
#   and with a version builds the installers without publishing them.
# So a Windows- or macOS-only break shows up at merge, not on the pull request.
# Start a manual run on the branch before merging anything platform-sensitive:
# window chrome, paths, packaging.
on:
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      version:
        description: Build installers stamped with this version
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      version:
        description: Optional. Build installers stamped with this version (for example 0.0.1); nothing is published
        type: string
        default: ''

# A newer push to the same pull request makes the older run pointless. Runs on
# main are never cancelled, so every merge gets a complete result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    # Defined once here and reused by `package` through the YAML anchor, so the
    # two jobs cannot disagree about platforms.
    strategy: &platforms # One platform failing must not hide the others.
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["windows-latest", "ubuntu-latest", "macos-latest"]') }}

    steps:
      # External actions are pinned to reviewed commit SHAs; the comment names the
      # release each one was resolved from.
      - &checkout
        name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Reads the pinned pnpm version from the packageManager field.
      - &setup-pnpm
        name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true

      - &setup-node
        name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - &install
        name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The staging tests in experiments/packaging copy this bundle, so it has to
      # exist before the tests.
      - name: Build the MCP server bundle
        run: pnpm build:mcp

      # This includes experiments/packaging. Its staging suites run here for real;
      # the two packaged-app suites skip, because no package exists yet. That skip
      # is expected and is not coverage: `package` runs those suites.
      - name: Lint, format check, typecheck and test
        run: pnpm check

  package:
    name: Package and test the app (${{ matrix.os }})
    needs: check
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy: *platforms

    steps:
      - *checkout
      - *setup-pnpm
      - *setup-node
      - *install

      # Only in the runner's copy: the version is never committed. Both package.json
      # files are stamped, so the installers and the bundled MCP server report the
      # same version.
      - name: Stamp the release version
        if: inputs.version
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Not a release version: $VERSION" >&2
            exit 1
          fi
          for dir in apps/desktop packages/mcp; do
            (cd "$dir" && npm pkg set version="$VERSION")
          done

      # Builds the MCP bundle itself before packaging. `--dir` alone packages only
      # the runner's own CPU, so macOS asks for both: the Intel app is otherwise
      # never packaged or checked before a release (ticket eca73450).
      - name: Build and package the desktop app
        if: runner.os != 'macOS' && !inputs.version
        run: pnpm pack:dir

      - name: Build and package the desktop app for both Mac CPUs
        if: runner.os == 'macOS' && !inputs.version
        run: pnpm pack:dir:mac

      # The installers D-028 ships: Windows NSIS x64, both macOS DMGs, and the
      # Linux deb (AppImage is configured but not released yet). They also leave
      # the unpacked app beside them, which the packaged tests below use.
      # Unsigned for now (ticket a415fdb2): discovery is off so a signing
      # certificate that happens to be on a runner is never used by accident.
      - name: Build the installers
        if: inputs.version
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          case "$RUNNER_OS" in
            Windows) pnpm pack:installers --win ;;
            macOS) pnpm pack:installers --mac ;;
            Linux) pnpm pack:installers --linux deb ;;
          esac

      # Evidence, not a gate: whether the Intel app's own Node starts on this arm
      # runner, which needs Rosetta. The packaged tests read its header and do not
      # run it, so this is the only place it is started.
      - name: Start the Intel Mac runtime under Rosetta
        if: runner.os == 'macOS'
        continue-on-error: true
        run: |
          node_x64="$(ls -d apps/desktop/release/mac/*.app)/Contents/Resources/mcp/node"
          file "$node_x64"
          arch -x86_64 "$node_x64" --version

      # Only the packaged-* suites; `check` already ran the rest. With
      # REQUIRE_PACKAGED_APP set they fail rather than skip if the package is missing.
      #
      # One of these launches the real Electron window. The Linux runner has no
      # display, so it gets a virtual one; without it the window test would fail
      # on Linux alone. Windows and macOS runners already have a display session.
      - name: Test the packaged app
        if: runner.os != 'Linux'
        run: pnpm --filter @knightbook/experiment-packaging test:packaged
        env:
          REQUIRE_PACKAGED_APP: '1'

      - name: Test the packaged app under a virtual display
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y xvfb
          xvfb-run --auto-servernum pnpm --filter @knightbook/experiment-packaging test:packaged
        env:
          REQUIRE_PACKAGED_APP: '1'

      # A failing window test leaves a screenshot and the app's stdout and stderr
      # here. Nothing is written when the tests pass.
      - name: Keep the packaged-window evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packaged-window-${{ matrix.os }}
          path: experiments/packaging/test-results/
          if-no-files-found: ignore
          retention-days: 14

      # Only after the packaged tests passed. Named by OS so release.yml can
      # collect all three; the publishing job checks it has one installer per target.
      - name: Keep the installers
        if: inputs.version
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installers-${{ runner.os }}
          path: |
            apps/desktop/release/Knightbook-*.exe
            apps/desktop/release/Knightbook-*.dmg
            apps/desktop/release/Knightbook-*.deb
          if-no-files-found: error
          retention-days: 7
