name: Pull request title

# Pull requests are squash-merged, so the title becomes the commit message on main,
# and the release workflow reads that message to choose the next version (D-040).
# A title that is not a Conventional Commit (`feat: …`, `fix: …`, `docs: …`) would
# merge without releasing, so it fails here instead. Editing the title re-runs it.
on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  title:
    name: Title is a Conventional Commit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      # The title arrives through the environment, never pasted into the script,
      # so a title containing shell syntax is only ever text.
      - name: Check the title
        run: printf '%s\n' "$TITLE" | pnpm exec commitlint --verbose
        env:
          TITLE: ${{ github.event.pull_request.title }}
