name: Workflow scripts

# Tests the scripts that workflows run from .github/scripts. They have no
# dependencies and are not part of the pnpm workspace, so `pnpm check` does not
# run them; this does, with Node's own test runner.
on:
  pull_request:
    branches: [main]
    paths: &scripts
      - '.github/scripts/**'
      - '.github/workflows/cla.yml'
      - '.github/workflows/workflow-scripts.yml'
  push:
    branches: [main]
    paths: *scripts

permissions:
  contents: read

jobs:
  test:
    name: Workflow script tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Run the tests
        run: node --test '.github/scripts/**/*.test.mjs'
