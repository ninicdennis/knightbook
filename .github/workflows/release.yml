name: Release

# A release is started by hand: "Run workflow" on the Actions tab, from main
# (decision D-048; docs/proposals/release-automation.md). Merging to main builds
# nothing, so several merges cost nothing until the maintainer decides main is
# ready, and then one release carries all of them. Three stages, each waiting for
# the last:
#
# 1. `version`: semantic-release reads the Conventional Commit messages since the
#    last v* tag and chooses the next version. It creates nothing. Commits that
#    touch none of APP_PATHS in apps/desktop/scripts/publishing/app-commits.mjs
#    (the website, docs, README, the board) are left out of the version and notes.
# 2. `ci`: the CI workflow, given that version, runs every check, builds the
#    installers stamped with it, and tests the packaged app on each platform.
# 3. `publish`: only if all of that passed, one job creates the tag and the
#    prerelease at the tested commit and attaches every installer.
#
# When nothing since the last tag calls for a release, `version` says so and the
# run stops there: nothing is built and nothing is published.

on:
  workflow_dispatch:

# One release at a time, never cancelled, so two presses cannot both pick the
# same version. A second press waits for the first, then finds nothing new since
# the tag the first created and stops after `version`.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    name: Choose the version
    # A manual start may name any branch; only main is ever released.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # semantic-release checks that it could push to main even in dry-run mode, and
    # gives up without that access. It pushes nothing: no tag, no commit.
    permissions:
      contents: write
    outputs:
      release: ${{ steps.next.outputs.release }}
      version: ${{ steps.next.outputs.version }}
      tag: ${{ steps.next.outputs.tag }}

    steps:
      # Full history and tags: the version depends on every commit since the last tag.
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      # Nothing here runs Electron, so its binary is not downloaded.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      # The token is given to this step alone, not to the install above.
      - name: Choose the next version
        id: next
        working-directory: apps/desktop
        run: node scripts/publishing/next-version.mjs "$RUNNER_TEMP/release-notes.md"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Keep the release notes
        if: steps.next.outputs.release == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-notes
          path: ${{ runner.temp }}/release-notes.md
          if-no-files-found: error
          retention-days: 7

  ci:
    name: CI
    needs: version
    # Nothing to release means nothing to build: no runner minutes on three platforms.
    if: needs.version.outputs.release == 'true'
    uses: ./.github/workflows/ci.yml
    with:
      version: ${{ needs.version.outputs.version }}

  publish:
    name: Publish the prerelease
    needs: [version, ci]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The only job that writes: it creates the tag and the release.
    permissions:
      contents: write

    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Collect the installers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: installers-*
          merge-multiple: true
          path: ${{ runner.temp }}/release-assets

      - name: Collect the release notes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-notes
          path: ${{ runner.temp }}

      # Checks there is one installer per target before writing anything, then
      # stages a draft, attaches every file and publishes it. A repeat run for an
      # already published release verifies it and changes nothing.
      - name: Publish the prerelease
        run: >-
          node apps/desktop/scripts/publishing/publish-release.mjs
          "$TAG" "$VERSION" "$GITHUB_SHA"
          "$RUNNER_TEMP/release-notes.md" "$RUNNER_TEMP/release-assets"
        env:
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

  # The website's download and releases pages list a release only once it is in
  # apps/website/src/download/releases.json (D-055). This job writes that entry
  # from the published release, with each installer's size and the checksum from
  # SHA256SUMS.txt, and pushes it to a branch. It opens no pull request: one
  # opened with this token would run no checks, so the maintainer opens it from
  # the link in the run summary, edits the copied known issues there, and merging
  # it deploys the site. A failure here leaves the published release as it is.
  website:
    name: Prepare the website update
    needs: [version, publish]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      # The latest main, not the released commit: the branch must merge cleanly.
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Read the published release
        run: |
          gh release view "$TAG" --json tagName,publishedAt,isPrerelease,assets > "$RUNNER_TEMP/release.json"
          gh release download "$TAG" --pattern SHA256SUMS.txt --dir "$RUNNER_TEMP"
        env:
          TAG: ${{ needs.version.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

      # No dependencies, so nothing is installed. Adds nothing if already listed.
      - name: Add it to the website's release data
        run: >-
          node apps/website/src/download/add-release.mjs
          apps/website/src/download/releases.json
          "$RUNNER_TEMP/release.json" "$RUNNER_TEMP/SHA256SUMS.txt"

      # Never pushes to main. A branch left by an earlier run, perhaps already
      # edited, is kept rather than overwritten.
      - name: Push a branch for the pull request
        run: |
          if git diff --quiet; then
            echo "Knightbook $VERSION is already on the website's releases; nothing to do." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git"
          if git ls-remote --exit-code --heads "$remote" "$BRANCH" > /dev/null; then
            echo "The branch $BRANCH already exists; it was left as it is." >> "$GITHUB_STEP_SUMMARY"
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git switch --create "$BRANCH"
            git commit --all --message "docs: add Knightbook $VERSION to the website's releases"
            git push "$remote" "HEAD:refs/heads/$BRANCH"
          fi
          title="docs: add Knightbook $VERSION to the website's releases"
          link="https://github.com/${GH_REPO}/compare/main...${BRANCH}?expand=1&title=$(jq -rn --arg t "$title" '$t|@uri')"
          {
            echo "## Website update"
            echo
            echo "[Open the pull request]($link) that adds Knightbook $VERSION to the download and releases pages."
            echo
            echo "Before merging, check its known issues, which were copied from the previous release,"
            echo "and whether the installation guide needs a change. Merging deploys the website."
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          VERSION: ${{ needs.version.outputs.version }}
          BRANCH: website/release-${{ needs.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
