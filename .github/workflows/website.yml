name: Website

# Builds the public website (apps/website) and deploys it to GitHub Pages
# (D-044). It has no stored secrets: deployment uses GitHub's own Pages actions
# and the short-lived token they request.
#
# - A pull request that changes the site builds a preview: the site exactly as a
#   private preview build makes it (drafts shown and marked, every page `noindex`
#   and labelled as a preview), kept as a downloadable artifact, because Pages has
#   no preview URLs. Its tests run in CI's `check` job, so they are not repeated.
# - A merge to main runs the website's tests, since website-only merges start no
#   CI run (D-041). If the DEPLOY_WEBSITE repository variable is 'true', it then
#   makes the production build, which refuses to build while any draft remains,
#   and deploys it. Until launch that variable is unset, so main gets a preview
#   build and nothing is published.
# - Rollback: re-run this workflow's run for the earlier commit on main
#   (Actions > Website > that run > Re-run all jobs). A re-run builds and deploys
#   that commit again. A failed build or deploy leaves the current site serving.
on:
  pull_request:
    branches: [main]
    paths: &site
      - 'apps/website/**'
      - 'LICENSE.md'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/website.yml'
  push:
    branches: [main]
    paths: *site
  workflow_dispatch:

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build the website
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      production: ${{ steps.stage.outputs.production }}
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Production only from main, and only once deployment is switched on.
      - name: Choose the build
        id: stage
        run: echo "production=${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DEPLOY_WEBSITE == 'true' }}" >> "$GITHUB_OUTPUT"

      - name: Install Chromium for the website's browser tests
        if: github.event_name != 'pull_request'
        run: pnpm --filter @knightbook/website exec playwright-core install --with-deps chromium

      - name: Typecheck and test the website
        if: github.event_name != 'pull_request'
        run: |
          pnpm --filter @knightbook/website typecheck
          pnpm --filter @knightbook/website test
        env:
          REQUIRE_WEBSITE_BROWSER: '1'

      - name: Build the preview
        if: steps.stage.outputs.production != 'true'
        run: pnpm --filter @knightbook/website build

      - name: Keep the preview
        if: steps.stage.outputs.production != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: website-preview
          path: apps/website/dist/
          retention-days: 14

      # Fails, naming each one, while any draft remains (drafts.ts).
      - name: Build for production
        if: steps.stage.outputs.production == 'true'
        run: pnpm --filter @knightbook/website build
        env:
          KNIGHTBOOK_SITE_STAGE: production

      - name: Keep the production build for Pages
        if: steps.stage.outputs.production == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/website/dist/

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: needs.build.outputs.production == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # One deployment at a time, and never cancelled halfway.
    concurrency:
      group: website-pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
