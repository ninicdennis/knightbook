name: Idea or request
description: Something Knightbook could do, or do differently.
labels: [idea]
body:
  - type: markdown
    attributes:
      value: Everything you write here is public, so leave out private project details.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation and the problem, rather than a particular solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
