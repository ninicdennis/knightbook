name: Bug report
description: Something in Knightbook does not work as described.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Everything you write here is public.

        **Do not paste private project content, credentials, tokens, or whole AI client logs.** Copy only the lines that show the error, and replace names, paths and secrets with placeholders such as `<project>` or `<token>`.

        A security problem should not be reported here: use [private vulnerability reporting](https://github.com/ninicdennis/knightbook/security/advisories/new) instead.
  - type: input
    id: version
    attributes:
      label: Knightbook version
      description: The version in the installer's file name, such as Knightbook-0.4.0-windows-x64.exe.
      placeholder: 0.4.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: OS version and processor
      placeholder: Windows 11 x64, macOS 15 on Apple silicon, Ubuntu 24.04 x64
    validations:
      required: true
  - type: input
    id: ai-client
    attributes:
      label: AI client, if one is involved
      description: Its name and version, for example Claude Code 2.1 or Codex 0.40. Leave empty if the problem is in the app alone.
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a project with ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected, and what happened instead
    validations:
      required: true
  - type: textarea
    id: errors
    attributes:
      label: Error messages (redacted)
      description: Only the relevant lines, with names, paths and secrets replaced.
      render: text
